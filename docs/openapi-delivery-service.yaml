openapi: 3.0.3
info:
  title: Delivery Service API
  description: API for managing office lunch delivery orders
  version: 1.0.0

servers:
  - url: http://localhost:3000/api

tags:
  - name: Orders
  - name: Participants
  - name: Items

paths:
  /orders:
    post:
      tags:
        - Orders
      summary: Create a new group order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    get:
      tags:
        - Orders
      summary: Get all orders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/confirm:
    post:
      tags:
        - Orders
      summary: Confirm group order
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/participants:
    post:
      tags:
        - Participants
      summary: Add participant to order
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRequest'
      responses:
        '201':
          description: Participant added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

    get:
      tags:
        - Participants
      summary: Get participants of order
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Participants list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'

  /orders/{orderId}/items:
    post:
      tags:
        - Items
      summary: Add meal item to order
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'

    get:
      tags:
        - Items
      summary: Get items in order
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'

components:
  parameters:
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string

  schemas:
    CreateOrderRequest:
      type: object
      required:
        - officeName
        - deadline
      properties:
        officeName:
          type: string
          example: IT Department
        deadline:
          type: string
          format: date-time

    AddParticipantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Ivan Petrenko

    AddItemRequest:
      type: object
      required:
        - participantId
        - mealName
        - quantity
      properties:
        participantId:
          type: string
          example: p123
        mealName:
          type: string
          example: Caesar Salad
        quantity:
          type: integer
          example: 2

    Order:
      type: object
      properties:
        id:
          type: string
          example: ord123
        officeName:
          type: string
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - OPEN
            - CONFIRMED
            - DELIVERED

    Participant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    OrderItem:
      type: object
      properties:
        id:
          type: string
        participantId:
          type: string
        mealName:
          type: string
        quantity:
          type: integer